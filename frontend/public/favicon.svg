<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="#0b0f19"/>
  <!-- Planet Globe -->
  <circle cx="16" cy="16" r="6" fill="url(#grad)"/>
  <!-- Orbit Path -->
  <ellipse cx="16" cy="16" rx="13" ry="5" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="3 2" transform="rotate(-30 16 16)"/>
  <!-- Satellite -->
  <circle cx="25" cy="11" r="2" fill="#38bdf8"/>
</svg>
