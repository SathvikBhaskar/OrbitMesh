services:
  postgres:
    image: postgres:17
    container_name: orbitmesh-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orbitmesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-orbitmesh}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orbitmesh}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: 
      context: ./backend
    container_name: orbitmesh-backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DEMO_MODE: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-orbitmesh}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-orbitmesh}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: orbitmesh-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
